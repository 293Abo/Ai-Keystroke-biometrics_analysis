<script>
        const TARGET = "Welcome Guest";

        function showTab(t) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('p-' + t).classList.add('active');
            if (t === 'stats') initChart();
        }

        // ==========================================
        // محرك التقاط المفاتيح المبسط والآمن للبوابة
        // ==========================================
        let pressTimers = {};
        let currentAttemptEvents = [];
        const gInput = document.getElementById('gInput');

        gInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                verifyGate();
                return;
            }
            // تسجيل وقت الضغط لكل مفتاح (بما فيه المسافة)
            if (!pressTimers[e.code]) {
                pressTimers[e.code] = {
                    key: e.key,
                    down: performance.now()
                };
            }
        });

        gInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') return;
            const upTime = performance.now();
            if (pressTimers[e.code]) {
                currentAttemptEvents.push({
                    key: pressTimers[e.code].key,
                    down: pressTimers[e.code].down,
                    up: upTime
                });
                delete pressTimers[e.code];
            }
        });

        async function verifyGate() {
            const typed = gInput.value;
            if (typed !== TARGET) {
                alert("Please type the exact text: " + TARGET);
                return;
            }

            if (currentAttemptEvents.length < TARGET.length) {
                alert("Keystrokes incomplete. Please type naturally without pasting.");
                gInput.value = '';
                currentAttemptEvents = [];
                pressTimers = {};
                return;
            }

            // اخذ آخر أحرف تطابق طول الكلمة تماماً
            const matchedEvents = currentAttemptEvents.slice(-TARGET.length);

            const keystrokesPayload = matchedEvents.map((k, idx) => ({
                key: k.key,
                hold: Math.max(0.01, (k.up - k.down) / 1000.0),
                flight: idx > 0 ? Math.max(0.005, (k.down - matchedEvents[idx-1].up) / 1000.0) : 0.0
            }));

            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keystrokes: keystrokesPayload })
                });
                const data = await res.json();

                const box = document.getElementById('gRes');
                box.style.display = 'block';
                document.getElementById('sVal').innerText = data.score;
                document.getElementById('dVal').innerText = data.dwell_ratio;

                if (data.authorized) {
                    box.className = 'result granted';
                    document.getElementById('rTitle').innerText = '🟢 ACCESS GRANTED';
                    document.getElementById('rDesc').innerText = `Identity Confirmed: ${data.owner}. Cadence aligns with the trained model.`;
                } else {
                    box.className = 'result denied';
                    document.getElementById('rTitle').innerText = '🔴 ACCESS DENIED';
                    document.getElementById('rDesc').innerText = `Imposter Cadence! Flight/hold distribution deviates from ${data.owner}.`;
                }
            } catch (err) {
                alert("Server Connection Error: " + err);
            } finally {
                gInput.value = '';
                currentAttemptEvents = [];
                pressTimers = {};
            }
        }

        // ==========================================
        // محرك التدريب المباشر (Studio) المبسط
        // ==========================================
        let tPressTimers = {};
        let tCurrentEvents = [];
        let userAttempts = [];
        const tInput = document.getElementById('tInput');

        tInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                processEnroll();
                return;
            }
            if (!tPressTimers[e.code]) {
                tPressTimers[e.code] = { key: e.key, down: performance.now() };
            }
        });

        tInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') return;
            const upTime = performance.now();
            if (tPressTimers[e.code]) {
                tCurrentEvents.push({
                    key: tPressTimers[e.code].key,
                    down: tPressTimers[e.code].down,
                    up: upTime
                });
                delete tPressTimers[e.code];
            }
        });

        async function processEnroll() {
            if (tInput.value !== TARGET) {
                alert("Type exact text: " + TARGET);
                tInput.value = '';
                tCurrentEvents = [];
                tPressTimers = {};
                return;
            }

            if (tCurrentEvents.length < TARGET.length) {
                alert("Incomplete sequence. Try again.");
                tInput.value = '';
                tCurrentEvents = [];
                tPressTimers = {};
                return;
            }

            const matchedEvents = tCurrentEvents.slice(-TARGET.length);
            const attempt = matchedEvents.map((k, idx) => ({
                key: k.key,
                hold: Math.max(0.01, (k.up - k.down) / 1000.0),
                flight: idx > 0 ? Math.max(0.005, (k.down - matchedEvents[idx-1].up) / 1000.0) : 0.0
            }));

            userAttempts.push(attempt);
            tInput.value = '';
            tPressTimers = {};
            tCurrentEvents = [];

            const count = userAttempts.length;
            document.getElementById('tCount').innerText = `${count} / 10`;

            if (count < 10) {
                document.getElementById('tStatus').innerText = `Attempt #${count} recorded. Type next one!`;
            } else {
                document.getElementById('tStatus').innerText = "Fitting One-Class SVM to your rhythm...";
                const name = document.getElementById('uName').value || "Verified Owner";
                const res = await fetch('/api/enroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: name, attempts: userAttempts })
                });
                const data = await res.json();
                if (data.success) {
                    alert(`🎉 Model successfully retrained on ${data.owner}!`);
                    location.reload();
                }
            }
        }

        // ==========================================
        // الرسوم البيانية (Charts)
        // ==========================================
        let chartInitialized = false;
        function initChart() {
            if (chartInitialized) return;
            chartInitialized = true;
            new Chart(document.getElementById('cChart'), {
                type: 'scatter',
                data: {
                    datasets: [
                        { label: 'Authorized Owner', data: Array.from({length:30}, () => ({x: +(0.105 + Math.random()*0.02).toFixed(3), y: +(0.280 + Math.random()*0.04).toFixed(3)})), backgroundColor: '#2997ff' },
                        { label: 'Imposter A', data: Array.from({length:30}, () => ({x: +(0.075 + Math.random()*0.02).toFixed(3), y: +(0.170 + Math.random()*0.04).toFixed(3)})), backgroundColor: '#ff453a' },
                        { label: 'Imposter B', data: Array.from({length:30}, () => ({x: +(0.145 + Math.random()*0.02).toFixed(3), y: +(0.380 + Math.random()*0.04).toFixed(3)})), backgroundColor: '#ff9f0a' }
                    ]
                },
                options: {
                    plugins: { legend: { labels: { color: '#86868b' } } },
                    scales: {
                        x: { title: { display: true, text: 'Mean Hold Time (s)', color: '#86868b' }, grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#86868b' } },
                        y: { title: { display: true, text: 'Mean Flight Time (s)', color: '#86868b' }, grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#86868b' } }
                    }
                }
            });
        }
    </script>
