<script>
        const TARGET = "Welcome Guest";

        function showTab(t) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('p-' + t).classList.add('active');
            if (t === 'stats') initChart();
        }

        // ==========================================
        // محرك التقاط المفاتيح الدقيق والمتوافق 100%
        // ==========================================
        let gActiveKeys = {};
        let gKeyLogs = [];
        const gInput = document.getElementById('gInput');

        gInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                verifyGate();
                return;
            }
            // تسجيل لحظة الضغط الحقيقية لكل زر (بما فيه المسافة والرموز)
            if (!gActiveKeys[e.key]) {
                gActiveKeys[e.key] = performance.now();
            }
        });

        gInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') return;
            if (gActiveKeys[e.key]) {
                gKeyLogs.push({
                    key: e.key,
                    down: gActiveKeys[e.key],
                    up: performance.now()
                });
                delete gActiveKeys[e.key];
            }
        });

        // دالة الفحص والإرسال للـ AI
        async function verifyGate() {
            const currentVal = gInput.value.trim();

            if (currentVal !== TARGET) {
                alert("Please type the exact text: " + TARGET);
                return;
            }

            // تصفية وترتيب الأحرف حسب كلمة Welcome Guest بدقة كولاب
            let clean = [];
            let tIndex = TARGET.length - 1;
            for (let i = gKeyLogs.length - 1; i >= 0; i--) {
                if (gKeyLogs[i].key === TARGET[tIndex]) {
                    clean.unshift(gKeyLogs[i]);
                    tIndex--;
                    if (tIndex < 0) break;
                }
            }

            if (clean.length < TARGET.length) {
                alert("Please type the passphrase naturally without copying or skipping characters.");
                return;
            }

            const payloadKeystrokes = clean.map((k, i) => ({
                key: k.key,
                hold: Math.max(0.005, (k.up - k.down) / 1000.0),
                flight: i > 0 ? Math.max(0.005, (k.down - clean[i-1].up) / 1000.0) : 0.0
            }));

            try {
                const res = await fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keystrokes: payloadKeystrokes })
                });
                const data = await res.json();

                const box = document.getElementById('gRes');
                box.style.display = 'block';
                document.getElementById('sVal').innerText = data.score;
                document.getElementById('dVal').innerText = data.dwell_ratio;

                if (data.authorized) {
                    box.className = 'result granted';
                    document.getElementById('rTitle').innerText = '🟢 ACCESS GRANTED';
                    document.getElementById('rDesc').innerText = `Verified Profile: ${data.owner}. Neuromuscular metrics matched the One-Class SVM.`;
                } else {
                    box.className = 'result denied';
                    document.getElementById('rTitle').innerText = '🔴 ACCESS DENIED';
                    document.getElementById('rDesc').innerText = `Imposter Cadence! Deviation detected from ${data.owner}.`;
                }
            } catch (err) {
                alert("Server Connection Error: " + err);
            } finally {
                gInput.value = '';
                gKeyLogs = [];
                gActiveKeys = {};
            }
        }

        // ==========================================
        // التدريب المباشر (Studio Enrollment)
        // ==========================================
        let tActiveKeys = {};
        let tKeyLogs = [];
        let recordedAttempts = [];
        const tInput = document.getElementById('tInput');

        tInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleEnrollAttempt();
                return;
            }
            if (!tActiveKeys[e.key]) {
                tActiveKeys[e.key] = performance.now();
            }
        });

        tInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') return;
            if (tActiveKeys[e.key]) {
                tKeyLogs.push({
                    key: e.key,
                    down: tActiveKeys[e.key],
                    up: performance.now()
                });
                delete tActiveKeys[e.key];
            }
        });

        async function handleEnrollAttempt() {
            if (tInput.value.trim() !== TARGET) {
                alert("Please type the exact text: " + TARGET);
                tInput.value = '';
                tKeyLogs = [];
                tActiveKeys = {};
                return;
            }

            let clean = [];
            let tIndex = TARGET.length - 1;
            for (let i = tKeyLogs.length - 1; i >= 0; i--) {
                if (tKeyLogs[i].key === TARGET[tIndex]) {
                    clean.unshift(tKeyLogs[i]);
                    tIndex--;
                    if (tIndex < 0) break;
                }
            }

            const payloadKeystrokes = clean.map((k, i) => ({
                key: k.key,
                hold: Math.max(0.005, (k.up - k.down) / 1000.0),
                flight: i > 0 ? Math.max(0.005, (k.down - clean[i-1].up) / 1000.0) : 0.0
            }));

            recordedAttempts.push(payloadKeystrokes);
            tInput.value = '';
            tKeyLogs = [];
            tActiveKeys = {};

            const count = recordedAttempts.length;
            document.getElementById('tCount').innerText = `${count} / 10`;

            if (count < 10) {
                document.getElementById('tStatus').innerText = `Sample #${count} saved. Next sample ready!`;
            } else {
                document.getElementById('tStatus').innerText = "Training new One-Class SVM on your identity...";
                const name = document.getElementById('uName').value || "Verified Owner";
                const res = await fetch('/api/enroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: name, attempts: recordedAttempts })
                });
                const data = await res.json();
                if (data.success) {
                    alert(`🎉 Successfully trained model on ${data.owner}'s rhythm!`);
                    location.reload();
                }
            }
        }

        // ==========================================
        // الرسوم البيانية (Charts)
        // ==========================================
        let chartDone = false;
        function initChart() {
            if (chartDone) return;
            chartDone = true;
            new Chart(document.getElementById('cChart'), {
                type: 'scatter',
                data: {
                    datasets: [
                        { label: 'Owner Profile', data: Array.from({length:35}, () => ({x: +(0.105 + Math.random()*0.02).toFixed(3), y: +(0.280 + Math.random()*0.04).toFixed(3)})), backgroundColor: '#2997ff' },
                        { label: 'Imposter 1', data: Array.from({length:35}, () => ({x: +(0.075 + Math.random()*0.02).toFixed(3), y: +(0.170 + Math.random()*0.04).toFixed(3)})), backgroundColor: '#ff453a' },
                        { label: 'Imposter 2', data: Array.from({length:35}, () => ({x: +(0.145 + Math.random()*0.02).toFixed(3), y: +(0.380 + Math.random()*0.04).toFixed(3)})), backgroundColor: '#ff9f0a' }
                    ]
                },
                options: {
                    plugins: { legend: { labels: { color: '#86868b' } } },
                    scales: {
                        x: { title: { display: true, text: 'Mean Hold Time (s)', color: '#86868b' }, grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#86868b' } },
                        y: { title: { display: true, text: 'Mean Flight Time (s)', color: '#86868b' }, grid: { color: 'rgba(255,255,255,0.06)' }, ticks: { color: '#86868b' } }
                    }
                }
            });
        }
    </script>
